<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">HX711 weight and RPM measurement paths</title><desc id="desc">Loadcell signals enter HX711. PB8 DOUT and PB9 SCK connect it to STM32F103 acquisition with TIM2 timing, 50 sample averaging and calibration to integer milligrams. A separate PA0 falling edge path is intended to count speed sensor pulses and uses TIM3 to calculate RPM every second. The EXTI0 interrupt wiring needs completion. Outputs are observed in a debugger.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#078b84"/></marker></defs>
<rect width="1200" height="700" rx="24" fill="#f4f8fb"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#16314d">
<text x="48" y="58" font-size="32" font-weight="700">HX711 / Two measurement paths</text><text x="48" y="92" font-size="20" fill="#547086">STM32F103 acquisition and debugger observation</text>
<rect x="48" y="128" width="1104" height="242" rx="18" fill="white" stroke="#d7e3ea" stroke-width="2"/>
<text x="76" y="167" font-size="23" font-weight="700">WEIGHT / calibrated mass in milligrams</text>
<g fill="#e7f6f3" stroke="#acd7cf"><rect x="76" y="194" width="190" height="92" rx="12"/><rect x="311" y="194" width="190" height="92" rx="12"/><rect x="546" y="194" width="265" height="92" rx="12"/></g>
<rect x="856" y="194" width="265" height="92" rx="12" fill="#16314d"/>
<g font-size="23" font-weight="600" text-anchor="middle"><text x="171" y="231">Load cell</text><text x="406" y="231">HX711 ADC</text><text x="678" y="231">50-sample mean</text><text x="988" y="231" fill="white">weight / integer mg</text></g>
<g font-size="19" text-anchor="middle" fill="#547086"><text x="171" y="263">E+/E- and A+/A-</text><text x="406" y="263">24 bits + 1 pulse</text><text x="678" y="263">TIM2 delay timing</text><text x="988" y="263" fill="#ccefeb">Tare + scale factor</text></g>
<g stroke="#078b84" stroke-width="4" marker-end="url(#a)"><path d="M273 240 H301"/><path d="M508 240 H536"/><path d="M818 240 H846"/></g>
<text x="76" y="321" font-size="21">DOUT: PB8 / SCK: PB9 / ready timeout: more than 200 ms</text>
<text x="76" y="350" font-size="19" fill="#547086">Hardware RATE setting controls ADC sampling; the firmware does not set it.</text>
<rect x="48" y="393" width="1104" height="220" rx="18" fill="white" stroke="#d7e3ea" stroke-width="2"/>
<text x="76" y="432" font-size="23" font-weight="700">SPEED / intended pulse-counting path</text>
<g fill="#e7f6f3" stroke="#acd7cf"><rect x="76" y="456" width="240" height="82" rx="12"/><rect x="368" y="456" width="320" height="82" rx="12"/></g>
<rect x="740" y="456" width="381" height="82" rx="12" fill="#16314d"/>
<g font-size="23" text-anchor="middle" font-weight="600"><text x="196" y="490">Speed sensor</text><text x="528" y="490">PA0 falling edges</text><text x="930" y="490" fill="white">rpm = pulse_count * 60</text></g>
<g font-size="19" text-anchor="middle" fill="#547086"><text x="196" y="519">One pulse / revolution</text><text x="528" y="519">EXTI0 wiring needs completion</text><text x="930" y="519" fill="#ccefeb">TIM3: 1-second window</text></g>
<g stroke="#078b84" stroke-width="4" marker-end="url(#a)"><path d="M323 497 H358"/><path d="M695 497 H730"/></g>
<text x="76" y="580" font-size="21">Read weight, rpm and pulse_count using a SWD debug session.</text>
<text x="48" y="663" font-size="19" fill="#547086">Source: HX711/Core/Src/main.c, stm32f1xx_hal_msp.c and stm32f1xx_it.c</text>
</g></svg>
